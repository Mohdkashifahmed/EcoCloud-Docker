services:
  ecocloud:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_ADMIN_EMAIL: ${VITE_ADMIN_EMAIL:-admin@ecocloud.demo}
    ports:
      - "8080:80"
    container_name: ecocloud-frontend
    restart: unless-stopped
